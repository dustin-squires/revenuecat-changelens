services:
  - type: web
    name: revenuecat-changelens
    runtime: static
    buildCommand: npx --yes pnpm@10.15.1 install --frozen-lockfile && npx --yes pnpm@10.15.1 build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    previews:
      generation: automatic
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
